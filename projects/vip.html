<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神秘入口 — CHU.LIFE</title>
  <link rel="stylesheet" href="../css/style.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), midi=(), speaker=(), vibrate=(), fullscreen=(self)">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="color-scheme" content="dark light">
  <style>
    /* ===== 神秘入口（恶搞版）===== */
    body { min-height: 100vh; }

    /* 顶部暗号搜索框 */
    .pin-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; gap: .5rem;
      padding: .6rem 1.2rem;
      background: var(--bg);
      border-bottom: 1px dashed var(--border);
    }
    .pin-input {
      flex: 1; max-width: 320px;
      background: var(--surface); color: var(--text1);
      border: 1px solid var(--border); border-radius: 99px;
      padding: .5rem 1.1rem; font-size: .9rem; outline: none;
    }
    .pin-input:focus { border-color: var(--accent); }
    .pin-btn {
      background: var(--accent); color: #fff; border: none; cursor: pointer;
      border-radius: 99px; padding: .5rem 1.2rem;
      font-size: .9rem; font-weight: 600;
    }
    .pin-btn:hover { filter: brightness(1.12); }
    .pin-err {
      position: absolute; top: calc(100% + .35rem); left: 1.2rem;
      margin: 0; font-size: .78rem; color: #ff6b81;
      background: var(--surface); border: 1px solid var(--border);
      padding: .3rem .7rem; border-radius: 8px;
    }

    /* 主体 */
    .gate {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding: 7rem 1.2rem 2.5rem;
    }
    .gate-emoji {
      font-size: 4.2rem; line-height: 1;
      animation: gateHop 2.4s ease-in-out infinite;
      margin-bottom: 1.2rem;
    }
    @keyframes gateHop {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-12px) rotate(6deg); }
    }
    .gate-title { font-size: clamp(1.7rem, 5vw, 2.4rem); margin: 0 0 .6rem; }
    .gate-sub { color: var(--text3); font-size: .92rem; margin: 0 0 2.6rem; }

    .gate-box {
      width: min(400px, 100%);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 1.6rem 1.4rem;
    }
    .gate-label { display: block; font-weight: 700; margin-bottom: .8rem; }
    .gate-row { display: flex; gap: .5rem; }
    .gate-input {
      flex: 1; min-width: 0;
      background: var(--bg); color: var(--text1);
      border: 1px solid var(--border); border-radius: 10px;
      padding: .6rem .9rem; font-size: .95rem; outline: none;
    }
    .gate-input:focus { border-color: var(--accent); }
    .gate-btn {
      background: var(--accent); color: #fff; border: none; cursor: pointer;
      border-radius: 10px; padding: .6rem .95rem;
      font-size: .88rem; font-weight: 600; white-space: nowrap;
    }
    .gate-btn:hover { filter: brightness(1.12); }
    .gate-err { min-height: 1.2em; margin: .55rem 0 .2rem; font-size: .85rem; color: #ff6b81; }
    .gate-count { margin: 0; font-size: .75rem; color: var(--text3); min-height: 1em; }

    .gate-row.shake, .pin-bar.shake { animation: vipShake .4s; }
    @keyframes vipShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    /* PIN 揭晓面板 */
    .pin-panel {
      display: none;
      margin-top: 1.6rem;
      width: min(400px, 100%);
      background: var(--surface);
      border: 1px dashed var(--accent);
      border-radius: 16px;
      padding: 1.4rem 1.2rem;
    }
    .pin-panel.show { display: block; animation: gatePop .35s ease-out; }
    @keyframes gatePop {
      from { opacity: 0; transform: scale(.92) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .pin-congrats { margin: 0 0 .5rem; font-weight: 700; font-size: 1.05rem; }
    .pin-label { margin: 0 0 .7rem; color: var(--text2); font-size: .88rem; }
    .pin-code {
      display: inline-block;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 1.5rem; font-weight: 700; letter-spacing: .12em;
      color: var(--accent);
      border: 1px dashed var(--accent);
      border-radius: 10px;
      padding: .5rem 1.2rem;
      background: var(--bg);
      animation: gatePulse 1.6s ease-in-out infinite;
    }
    @keyframes gatePulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
      50% { box-shadow: 0 0 0 8px rgba(212,168,83,0); }
    }
    .pin-hint { margin: .9rem 0 0; font-size: .8rem; color: var(--text3); }

    .gate-foot { margin-top: 2.4rem; font-size: .75rem; color: var(--text3); }
  </style>
</head>
<body>
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- 顶部暗号搜索框 -->
  <form id="pinSearch" class="pin-bar" autocomplete="off">
    <input id="pinInput" class="pin-input" type="text" placeholder="🔑 输入通关暗号…" autocomplete="off">
    <button class="pin-btn" type="submit">验证</button>
    <p id="pinErr" class="pin-err"></p>
  </form>

  <main class="gate">
    <div class="gate-emoji">🕵️</div>
    <h1 class="gate-title">神秘入口</h1>
    <p class="gate-sub">全站最神秘的通道，据说只有一个人能进去…</p>

    <div class="gate-box">
      <label class="gate-label" for="nameInput">先报上名来！</label>
      <div class="gate-row" id="nameRow">
        <input id="nameInput" class="gate-input" type="text" placeholder="输入你的大名" autocomplete="off">
        <button id="nameBtn" class="gate-btn" type="button">我看看你是哪位</button>
      </div>
      <p id="nameErr" class="gate-err"></p>
      <p id="rejectCount" class="gate-count"></p>
    </div>

    <div id="pinPanel" class="pin-panel">
      <p class="pin-congrats">🎉 恭喜恭喜！你就是天选之人！</p>
      <p class="pin-label">你的专属通关暗号：</p>
      <div id="pinCode" class="pin-code">yanshuai666</div>
      <p class="pin-hint">↑ 把暗号复制下来，填到页面最上方的搜索框，就能开启你的专属页面 ↑</p>
    </div>

    <p class="gate-foot">ps：此通道有洁癖，只认闫帅。</p>
  </main>

  <script src="../js/vip.js"></script>
</body>
</html>
