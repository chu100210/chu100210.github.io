<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>闫帅 · VIP — CHU.LIFE</title>
  <link rel="stylesheet" href="../css/style.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), midi=(), speaker=(), vibrate=(), fullscreen=(self)">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="color-scheme" content="dark light">
  <style>
    /* ===== 闫帅专属页 ===== */
    .ys-main {
      position: relative;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: calc(var(--nav-h) + 2rem) 1.5rem 3rem;
      overflow: hidden;
    }

    /* 背景光晕 */
    .ys-bg { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
    .ys-bg .glow {
      position: absolute; border-radius: 50%; filter: blur(70px); opacity: .45;
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
    }
    .ys-bg .g1 { width: 480px; height: 480px; top: 12%; left: 50%; transform: translateX(-50%); }
    .ys-bg .g2 { width: 320px; height: 320px; bottom: 8%; right: 18%; opacity: .3; }

    /* 头部徽标 */
    .ys-badge {
      position: relative; z-index: 3;
      font-size: .65rem; font-weight: 700; letter-spacing: .35em;
      text-transform: uppercase; color: var(--accent);
      border: 1px solid var(--border-hover);
      padding: .45em 1.4em; border-radius: 99px;
      background: var(--surface);
      margin-bottom: 2.5rem;
    }

    /* 舞台：大字在后，头像在前 */
    .ys-stage {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
    }

    /* 背后的“闫帅”大字 */
    .ys-giant {
      position: relative; z-index: 0;
      display: flex; gap: .35em;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(9rem, 26vw, 17rem);
      line-height: 1;
      letter-spacing: -.05em;
      color: var(--accent);
      opacity: .18;
      user-select: none;
      -webkit-text-stroke: 1px var(--accent);
      text-shadow: 0 0 80px var(--accent-glow);
      animation: ysGiantBreathe 6s ease-in-out infinite;
    }
    @keyframes ysGiantBreathe {
      0%, 100% { opacity: .16; transform: scale(1); }
      50% { opacity: .24; transform: scale(1.03); }
    }
    html.light .ys-giant {
      opacity: .22;
      color: var(--accent);
    }

    /* 头像：居中叠在字上，背景透明 */
    .ys-avatar {
      position: absolute; z-index: 2;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: clamp(170px, 34vw, 250px);
      filter: drop-shadow(0 18px 50px rgba(0,0,0,.5));
      animation: ysAvatarFloat 5.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes ysAvatarFloat {
      0%, 100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-50%, calc(-50% - 10px)); }
    }

    /* 底部签名 */
    .ys-sign {
      position: relative; z-index: 3;
      margin-top: 2.8rem; text-align: center;
    }
    .ys-sign .line {
      width: 56px; height: 1px; margin: 0 auto .9rem;
      background: linear-gradient(to right, transparent, var(--accent), transparent);
    }
    .ys-sign p {
      font-size: .72rem; letter-spacing: .3em; color: var(--text3);
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      .ys-giant { font-size: clamp(6rem, 34vw, 10rem); }
    }
  </style>
</head>
<body>
  <div class="cursor-glow" id="cursorGlow"></div>

  <main class="ys-main">
    <div class="ys-bg">
      <div class="glow g1"></div>
      <div class="glow g2"></div>
    </div>

    <div class="ys-badge">V I P &nbsp;·&nbsp; M E M B E R</div>

    <div class="ys-stage">
      <!-- 背后大字 -->
      <div class="ys-giant">闫帅</div>
      <!-- 头像（透明背景） -->
      <img class="ys-avatar" src="../yanshuai/avatar.png" alt="闫帅">
    </div>

    <div class="ys-sign">
      <div class="line"></div>
      <p>Y a n &nbsp; S h u a i</p>
    </div>
  </main>

  <script src="../js/yanshuai.js"></script>
</body>
</html>
