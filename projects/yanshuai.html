<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>闫帅 · 全站唯一 VIP — CHU.LIFE</title>
  <link rel="stylesheet" href="../css/style.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), midi=(), speaker=(), vibrate=(), fullscreen=(self)">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="color-scheme" content="dark light">
  <style>
    /* ===== 闫帅专属页（恶搞版）===== */
    .ys-main {
      position: relative; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 3rem 1.2rem 2.5rem;
      overflow: hidden;
    }

    /* 彩带雨 */
    .confetti-wrap { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
    .confetti {
      position: absolute; top: -3%;
      width: 9px; height: 15px; border-radius: 3px;
      animation: confFall linear infinite;
    }
    @keyframes confFall {
      to { transform: translateY(115vh) rotate(720deg); }
    }

    /* 徽章 */
    .ys-badge {
      position: relative; z-index: 3;
      font-size: .82rem; font-weight: 700; color: #fff;
      padding: .55em 1.3em; border-radius: 99px;
      background: linear-gradient(90deg, #ff6b81, #ffa94d, #ffd43b);
      box-shadow: 0 6px 24px rgba(255,107,129,.35);
      margin-bottom: 1.6rem;
      animation: badgeBounce 2s ease-in-out infinite;
    }
    @keyframes badgeBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* 舞台：大字在后，头像在前 */
    .ys-stage {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .ys-giant {
      position: relative; z-index: 0;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(8rem, 24vw, 16rem);
      line-height: 1; letter-spacing: -.05em;
      background: linear-gradient(90deg, #ff6b81, #ffa94d, #ffd43b, #69db7c, #4dabf7);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      opacity: .55;
      transform: rotate(-4deg);
      user-select: none;
      animation: ysWiggle 4s ease-in-out infinite;
    }
    @keyframes ysWiggle {
      0%, 100% { transform: rotate(-4deg) scale(1); }
      50% { transform: rotate(-7deg) scale(1.04); }
    }

    .ys-avatar-wrap {
      position: absolute; z-index: 2; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      animation: ysFloat 5.5s ease-in-out infinite;
      text-align: center;
    }
    @keyframes ysFloat {
      0%, 100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-50%, calc(-50% - 10px)); }
    }
    .ys-crown {
      display: block; font-size: clamp(2.2rem, 6vw, 3rem); line-height: 1;
      margin-bottom: -1.1rem; transform: rotate(10deg);
      animation: crownBob 2.4s ease-in-out infinite;
      filter: drop-shadow(0 4px 10px rgba(255,212,59,.5));
    }
    @keyframes crownBob {
      0%, 100% { transform: rotate(10deg) translateY(0); }
      50% { transform: rotate(-6deg) translateY(-7px); }
    }
    .ys-avatar {
      display: block; margin: 0 auto;
      width: clamp(170px, 34vw, 250px);
      filter: drop-shadow(0 16px 44px rgba(0,0,0,.5));
      pointer-events: none;
    }

    /* 恭喜标题 */
    .ys-congrats {
      position: relative; z-index: 3;
      margin: 1.8rem 0 0;
      font-size: clamp(1.15rem, 4vw, 1.5rem); font-weight: 800;
    }

    /* 特权卡片 */
    .ys-cards {
      position: relative; z-index: 3;
      display: flex; flex-wrap: wrap; gap: .8rem; justify-content: center;
      margin-top: 1.6rem; max-width: 620px;
    }
    .ys-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: .75rem 1.05rem;
      font-size: .8rem; color: var(--text2); text-align: center;
      min-width: 118px;
      transition: transform .25s;
    }
    .ys-card:hover { transform: translateY(-4px) rotate(-2deg); }
    .ys-card b { display: block; font-size: .95rem; color: var(--accent); margin-bottom: .15rem; }

    /* 今日特权 */
    .ys-tip {
      position: relative; z-index: 3;
      margin: 1.4rem 0 0; font-size: .82rem; color: var(--text3);
    }

    /* 跑马灯 */
    .ys-marquee {
      position: relative; z-index: 3;
      width: 100%; overflow: hidden; margin-top: 1.8rem;
      border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border);
      padding: .55rem 0;
    }
    .ys-marquee-inner { display: flex; width: max-content; animation: marq 13s linear infinite; }
    .ys-marquee-inner span { white-space: nowrap; font-size: .82rem; color: var(--text2); padding-right: 1.5rem; }
    @keyframes marq { to { transform: translateX(-50%); } }

    .ys-foot {
      position: relative; z-index: 3;
      margin-top: 1.6rem; font-size: .72rem; color: var(--text3); text-align: center;
    }
  </style>
</head>
