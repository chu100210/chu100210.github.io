<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MJ — CHU.LIFE</title>
  <link rel="stylesheet" href="../css/style.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), midi=(), speaker=(), vibrate=(), fullscreen=(self)">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="color-scheme" content="dark light">
  <style>
    /* ===== MJ 页面 ===== */
    .mj-main {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-h) + 2rem) 1.5rem 5rem;
      overflow: hidden;
    }

    /* 背景氛围 */
    .mj-bg {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
    }
    .mj-bg .orb {
      position: absolute; border-radius: 50%;
      filter: blur(60px); opacity: .5;
    }
    .mj-bg .orb-1 {
      width: 420px; height: 420px;
      top: -80px; left: 50%; transform: translateX(-50%);
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      animation: mjOrbFloat 8s ease-in-out infinite;
    }
    .mj-bg .orb-2 {
      width: 300px; height: 300px;
      bottom: -60px; right: 15%;
      background: radial-gradient(circle, rgba(140,120,220,.14), transparent 70%);
      animation: mjOrbFloat 10s ease-in-out infinite reverse;
    }
    .mj-bg .orb-3 {
      width: 260px; height: 260px;
      bottom: 5%; left: 12%;
      background: radial-gradient(circle, rgba(90,180,220,.12), transparent 70%);
      animation: mjOrbFloat 12s ease-in-out infinite;
    }
    @keyframes mjOrbFloat {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(24px); }
    }
    .mj-bg .orb-2 { animation-name: mjOrbFloat2; }
    .mj-bg .orb-3 { animation-name: mjOrbFloat2; }
    @keyframes mjOrbFloat2 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(28px); }
    }

    /* 网格纹理 */
    .mj-grid-pattern {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 70% 55% at 50% 45%, black 0%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 45%, black 0%, transparent 70%);
      opacity: .5;
    }

    /* 主卡片 */
    .mj-stage {
      position: relative; z-index: 1;
      display: flex; align-items: center; gap: 4rem;
      animation: mjStageIn .9s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes mjStageIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 图标 + 光环 */
    .mj-icon-wrap {
      position: relative; flex-shrink: 0;
      animation: mjIconFloat 5s ease-in-out infinite;
    }
    @keyframes mjIconFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .mj-icon {
      width: 200px; height: 200px;
      border-radius: 32px;
      object-fit: cover;
      box-shadow:
        0 24px 80px rgba(0,0,0,.45),
        0 0 0 1px rgba(255,255,255,.08) inset;
      position: relative; z-index: 2;
      display: block;
    }
    /* 光环 */
    .mj-halo {
      position: absolute; inset: -18px;
      border-radius: 42px;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        var(--accent) 80deg,
        transparent 140deg,
        transparent 200deg,
        rgba(140,120,220,.5) 260deg,
        transparent 320deg
      );
      opacity: .55;
      animation: mjHaloSpin 8s linear infinite;
      z-index: 1;
    }
    @keyframes mjHaloSpin {
      to { transform: rotate(360deg); }
    }
    .mj-halo-static {
      position: absolute; inset: -26px;
      border-radius: 46px;
      border: 1px solid var(--border-hover);
      z-index: 0;
    }

    /* 右侧信息 */
    .mj-info {
      display: flex; flex-direction: column; align-items: flex-start;
      gap: 1.5rem;
    }
    .mj-label {
      font-size: .68rem; font-weight: 700; letter-spacing: .3em;
      text-transform: uppercase; color: var(--accent);
      display: flex; align-items: center; gap: .5rem;
    }
    .mj-label::before {
      content: ""; width: 24px; height: 1px; background: var(--accent);
      opacity: .6;
    }
    .mj-name {
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 8vw, 5.5rem);
      font-weight: 900; letter-spacing: -.04em;
      line-height: 1;
      background: linear-gradient(135deg, var(--text) 40%, var(--accent) 130%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .mj-desc {
      font-size: .95rem; color: var(--text2);
      letter-spacing: .02em;
    }

    /* 下载按钮组 */
    .mj-actions {
      display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap;
    }
    .mj-dl-btn {
      position: relative;
      display: inline-flex; align-items: center; gap: .6rem;
      padding: 1rem 2.6rem;
      border-radius: 99px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #111;
      font-weight: 700; font-size: 1rem; letter-spacing: .02em;
      text-decoration: none;
      transition: all .35s cubic-bezier(.22,1,.36,1);
      border: none; cursor: pointer;
      font-family: var(--font);
      box-shadow: 0 8px 28px var(--accent-glow);
    }
    .mj-dl-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 14px 40px var(--accent-glow);
    }
    .mj-dl-btn:active { transform: translateY(0) scale(.98); }
    .mj-dl-btn .arr { transition: transform .3s; font-size: .9em; }
    .mj-dl-btn:hover .arr { transform: translateY(3px); }

    /* 密码胶囊 */
    .mj-pwd {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .55rem 1.2rem;
      border-radius: 99px;
      border: 1px dashed var(--border-hover);
      background: var(--surface);
      font-size: .8rem; color: var(--text2); letter-spacing: .03em;
    }
    .mj-pwd b { color: var(--accent); font-weight: 800; letter-spacing: .08em; }

    /* 响应式 */
    @media (max-width: 720px) {
      .mj-stage {
        flex-direction: column; gap: 2.5rem; text-align: center;
      }
      .mj-info { align-items: center; }
      .mj-icon { width: 160px; height: 160px; border-radius: 26px; }
      .mj-actions { justify-content: center; }
      .mj-label::before { display: none; }
    }
  </style>
</head>
<body>
  <div class="cursor-glow" id="cursorGlow"></div>

  <header class="site-header" id="header">
    <div class="container">
      <a href="../index.html" class="logo">CHU<span>.</span>LIFE</a>
      <nav class="site-nav">
        <a href="../index.html#works">作品</a>
        <a href="../index.html#awards">奖项</a>
        <a href="../index.html#about">关于</a>
        <a href="../index.html#contact">联系</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
      </button>
    </div>
  </header>

  <main class="mj-main">
    <div class="mj-bg">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>
    <div class="mj-grid-pattern"></div>

    <div class="mj-stage">
      <!-- 左：图标 -->
      <div class="mj-icon-wrap">
        <div class="mj-halo-static"></div>
        <div class="mj-halo"></div>
        <img class="mj-icon" src="../images/mj.jpg" alt="MJ 应用图标">
      </div>

      <!-- 右：名称 + 下载 -->
      <div class="mj-info">
        <div class="mj-label">Mjmj，不要离开我</div>
        <h1 class="mj-name">MJ</h1>
        <p class="mj-desc">Mj你快回来吧</p>
        <div class="mj-actions">
          <a class="mj-dl-btn" href="https://wwbnt.lanzoul.com/iha5o44puqrc" target="_blank" rel="noopener">
            下载应用 <span class="arr">↓</span>
          </a>
          <span class="mj-pwd">密码 <b>1145</b></span>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CHU.LIFE. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/common.js"></script>
</body>
</html>
