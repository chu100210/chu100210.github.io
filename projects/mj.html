<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MJ — CHU.LIFE</title>
  <link rel="stylesheet" href="../css/style.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), midi=(), speaker=(), vibrate=(), fullscreen=(self)">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="color-scheme" content="dark light">
  <style>
    /* ===== MJ 页面 ===== */
    .mj-main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-h) + 2rem) 1.5rem 4rem;
    }
    .mj-card {
      display: flex;
      align-items: center;
      gap: 3rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem 3.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
      transition: border-color .3s;
    }
    .mj-card:hover { border-color: var(--border-hover); }

    /* 图标 */
    .mj-icon {
      width: 180px; height: 180px;
      border-radius: 28px;
      object-fit: cover;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
      flex-shrink: 0;
    }

    /* 右侧信息 */
    .mj-info {
      display: flex; flex-direction: column; align-items: flex-start;
      gap: 1.25rem;
    }
    .mj-name {
      font-family: var(--font-display);
      font-size: 3rem; font-weight: 900; letter-spacing: -.03em;
      line-height: 1;
    }
    .mj-dl-btn {
      display: inline-flex; align-items: center; gap: .6rem;
      padding: .85rem 2.2rem;
      border-radius: 99px;
      background: var(--accent);
      color: #111;
      font-weight: 700; font-size: .95rem; letter-spacing: .02em;
      text-decoration: none;
      transition: all .3s;
      border: none; cursor: pointer;
      font-family: var(--font);
    }
    .mj-dl-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--accent-glow);
      background: var(--accent2);
    }
    .mj-pwd {
      font-size: .8rem; color: var(--text2); letter-spacing: .03em;
    }
    .mj-pwd b { color: var(--accent); font-weight: 700; }

    /* 响应式 */
    @media (max-width: 640px) {
      .mj-card {
        flex-direction: column; text-align: center;
        padding: 2.5rem 2rem; gap: 2rem;
      }
      .mj-info { align-items: center; }
      .mj-icon { width: 140px; height: 140px; border-radius: 22px; }
    }
  </style>
</head>
<body>
  <div class="cursor-glow" id="cursorGlow"></div>

  <header class="site-header" id="header">
    <div class="container">
      <a href="../index.html" class="logo">CHU<span>.</span>LIFE</a>
      <nav class="site-nav">
        <a href="../index.html#works">作品</a>
        <a href="../index.html#awards">奖项</a>
        <a href="../index.html#about">关于</a>
        <a href="../index.html#contact">联系</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
      </button>
    </div>
  </header>

  <main class="mj-main">
    <div class="mj-card reveal visible">
      <img class="mj-icon" src="../images/mj.jpg" alt="MJ 应用图标">
      <div class="mj-info">
        <h1 class="mj-name">MJ</h1>
        <a class="mj-dl-btn" href="https://wwbnt.lanzoul.com/iha5o44puqrc" target="_blank" rel="noopener">⬇ 立即下载</a>
        <p class="mj-pwd">下载密码：<b>1145</b></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CHU.LIFE. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/common.js"></script>
</body>
</html>
