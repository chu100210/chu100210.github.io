<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>五班 · 纪念至尊卡 — CHU.LIFE</title>
  <meta name="description" content="五班纪念至尊卡 · 入口">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), midi=(), speaker=(), vibrate=(), fullscreen=(self)">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="color-scheme" content="dark">
  <link rel="preload" as="image" href="cf.png" fetchpriority="high">

  <style>
    /* ============================================================
       五班 · 纪念至尊卡 —— 卡片从底部弹出入场
       ============================================================ */

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: #1b2cc1;
      --blue-lt: #3346f0;
      --blue-glow: rgba(51, 70, 240, .45);
      --bg: #07080d;
      --text: #f2eee6;
      --text2: rgba(242, 238, 230, .52);
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- 背景氛围 ---------- */
    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 6vh 5vw;
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(60% 55% at 50% 42%, rgba(27, 44, 193, .22) 0%, transparent 70%),
        radial-gradient(45% 45% at 82% 88%, rgba(212, 168, 83, .10) 0%, transparent 70%),
        radial-gradient(80% 80% at 50% 120%, rgba(0, 0, 0, .9) 0%, transparent 60%),
        #07080d;
    }

    /* 细网格,极轻 */
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(70% 60% at 50% 50%, #000 0%, transparent 100%);
      -webkit-mask-image: radial-gradient(70% 60% at 50% 50%, #000 0%, transparent 100%);
    }

    /* ---------- 布局:卡片 + 按钮 ---------- */
    .entry {
      display: flex;
      align-items: center;
      gap: clamp(1.6rem, 3.4vw, 3.2rem);
      width: 100%;
      max-width: 1000px;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.16, .84, .26, 1);
      will-change: transform;
    }

    /* ---------- 卡片 ---------- */
    .card {
      position: relative;
      flex: 0 1 620px;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: #0d0f16;
      box-shadow:
        0 40px 90px -20px rgba(0, 0, 0, .85),
        0 0 0 1px rgba(255, 255, 255, .09) inset,
        0 0 70px -10px var(--blue-glow);
      transform: translateY(115%) rotate(-4deg) scale(.94);
      opacity: 0;
      animation: cardUp 1.15s cubic-bezier(.16, .84, .26, 1) .18s forwards;
      will-change: transform, opacity;
    }

    .card img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 卡面高光扫过 */
    .card::after {
      content: "";
      position: absolute;
      top: -60%;
      left: -70%;
      width: 45%;
      height: 220%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent);
      transform: rotate(12deg);
      opacity: 0;
      animation: sheen 1.15s ease-out 1.15s 1 forwards;
      pointer-events: none;
    }

    @keyframes cardUp {
      0%   { transform: translateY(115%) rotate(-4deg) scale(.94); opacity: 0; }
      55%  { opacity: 1; }
      78%  { transform: translateY(-14px) rotate(.8deg) scale(1.005); }
      100% { transform: translateY(0) rotate(0) scale(1); opacity: 1; }
    }

    @keyframes sheen {
      0%   { opacity: 0; left: -70%; }
      25%  { opacity: .9; }
      100% { opacity: 0; left: 130%; }
    }

    /* 入场结束后轻微悬浮 */
    .card.settled {
      opacity: 1;
      animation: floatCard 6s ease-in-out infinite;
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0) rotate(0); }
      50%      { transform: translateY(-9px) rotate(-.25deg); }
    }

    /* ---------- 蓝色「进入」按钮 ---------- */
    .enter {
      flex: 0 0 auto;
      opacity: 0;
      transform: translateX(-18px);
      animation: enterIn .8s cubic-bezier(.16, .84, .26, 1) .95s forwards;
    }

    @keyframes enterIn {
      to { opacity: 1; transform: translateX(0); }
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      padding: 1.05rem 2.4rem;
      border-radius: 999px;
      font-size: 1.12rem;
      font-weight: 600;
      letter-spacing: .14em;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
      background: linear-gradient(135deg, var(--blue-lt) 0%, var(--blue) 55%, #101c8f 100%);
      box-shadow:
        0 14px 34px -8px var(--blue-glow),
        0 0 0 1px rgba(255, 255, 255, .14) inset;
      transition: transform .32s cubic-bezier(.16, .84, .26, 1),
                  box-shadow .32s ease,
                  filter .32s ease;
      position: relative;
      overflow: hidden;
    }

    /* 按钮内部流光 */
    .enter-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .35), transparent 70%);
      transform: translateX(-120%);
      transition: transform .7s ease;
    }

    .enter-btn:hover,
    .enter-btn:focus-visible {
      transform: translateY(-3px) scale(1.04);
      box-shadow:
        0 22px 48px -10px var(--blue-glow),
        0 0 0 1px rgba(255, 255, 255, .24) inset;
      filter: brightness(1.08);
      outline: none;
    }

    .enter-btn:hover::before,
    .enter-btn:focus-visible::before {
      transform: translateX(120%);
    }

    .enter-btn:active { transform: translateY(0) scale(.98); }

    .enter-btn .arrow {
      font-size: 1.05em;
      transition: transform .32s ease;
    }
    .enter-btn:hover .arrow { transform: translateX(4px); }

    /* 按钮下方的小提示 */
    .enter-hint {
      margin-top: .85rem;
      font-size: .78rem;
      letter-spacing: .18em;
      color: var(--text2);
      text-align: center;
      white-space: nowrap;
    }

    /* ---------- 移动端:按钮落到卡片下方 ---------- */
    @media (max-width: 760px) {
      .stage { padding: 5vh 6vw 8vh; }
      .entry {
        flex-direction: column;
        gap: 2rem;
      }
      .card { flex: 0 0 auto; border-radius: 16px; }
      .enter { text-align: center; }
      .enter-btn { padding: 1rem 2.2rem; font-size: 1.02rem; }
    }

    /* ---------- 降低动效偏好 ---------- */
    @media (prefers-reduced-motion: reduce) {
      .card,
      .card::after,
      .enter,
      .enter-btn::before {
        animation: none !important;
        transition: none !important;
      }
      .card { transform: none; opacity: 1; }
      .card::after { display: none; }
      .enter { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="entry" id="entry">
      <div class="card" id="card">
        <img src="cf.png" alt="五班纪念至尊卡 · 陈浮" width="1064" height="592">
      </div>

      <div class="enter">
        <a class="enter-btn" href="https://chulife.top/wuban" rel="noopener">
          进入 <span class="arrow" aria-hidden="true">→</span>
        </a>
        <p class="enter-hint">五班 · 我们的初中回忆</p>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var card = document.getElementById('card');
      var entry = document.getElementById('entry');
      if (!card) return;

      // 入场动画结束后切换为缓慢悬浮
      card.addEventListener('animationend', function (e) {
        if (e.animationName === 'cardUp') card.classList.add('settled');
      });

      // 轻微跟随鼠标的视差(仅桌面端)
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

      var raf = null;
      window.addEventListener('mousemove', function (e) {
        if (raf) return;
        raf = requestAnimationFrame(function () {
          raf = null;
          var x = (e.clientX / window.innerWidth - .5) * 2;
          var y = (e.clientY / window.innerHeight - .5) * 2;
          entry.style.transform =
            'perspective(1400px) rotateY(' + (x * 3).toFixed(2) + 'deg) ' +
            'rotateX(' + (-y * 2).toFixed(2) + 'deg)';
        });
      });
    })();
  </script>
</body>
</html>
