<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>passion! · 我们的口号 — 五班</title>
  <meta name="description" content="五班 · 我们的口号是 passion!">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="color-scheme" content="dark">

  <style>
    /* ============================================================
       passion! 粒子文字口号页
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: #04070f;              /* 深色底,突出蓝色发光 */
      overflow: hidden;                 /* 单屏效果页,不允许滚动 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;               /* 触摸交给 JS 处理,禁默认滚动缩放 */
    }

    /* 全屏画布 */
    #stage {
      position: fixed;
      inset: 0;
      display: block;
    }

    /* 左上角普通文字 */
    .slogan-label {
      position: fixed;
      top: 5vh;
      left: 6vw;
      z-index: 2;
      font-size: clamp(18px, 3vw, 26px);
      letter-spacing: 0.35em;
      color: rgba(226, 240, 255, 0.75);
      text-shadow: 0 0 18px rgba(77, 166, 255, 0.35);
      pointer-events: none;             /* 不挡鼠标交互 */
    }

    /* 底部小提示(可删) */
    .slogan-hint {
      position: fixed;
      bottom: 4.5vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      font-size: 12px;
      letter-spacing: 0.25em;
      color: rgba(180, 205, 235, 0.4);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="stage"></canvas>
  <p class="slogan-label">我们的口号是</p>
  <p class="slogan-hint">移动鼠标 / 滑动手指扰动 · 点击引爆</p>

  <script>
    /* ============================================================
       粒子文字引擎
       ============================================================ */
    (function () {
      'use strict';

      /* ================== 配置区(改这里) ================== */

      var CONFIG = {
        text: 'passion!',          // 要显示的文字

        // 颜色:蓝色系,允许深浅变化(每粒子随机选一个再微调亮度)
        colors: ['#4da6ff', '#00bfff', '#7dd3fc'],

        // 采样步长(px):越小粒子越多越密。小屏自动 +1 减密度
        sampleStep: 4,

        // 粒子光晕半径(px):星粒大小
        particleSize: 1.6,

        // 漂浮:呼吸感(振幅 px / 周期)
        floatAmp: 1.6,
        floatSpeed: 0.0012,

        // 闪烁:透明度上下波动的幅度与速度
        twinkleAmp: 0.28,
        twinkleSpeed: 0.0016,

        // 回位弹簧与阻尼:鼠标离开后粒子回弹的速度感
        spring: 0.045,
        damping: 0.86,

        // 鼠标影响半径(px)
        mouseRadius: 110,

        // 推力强度(鼠标越快越大,叠加在下面 speedFactor 上)
        pushForce: 0.35,
        speedFactor: 0.06,

        // 点击爆炸力度(随机扩散 + 中心向外冲量)
        blastForce: 9,

        // 背景残影:越小拖尾越长(0=不清屏,1=每帧完全清屏)
        trail: 0.22,

        // 鼠标光晕半径(与移动速度相关)
        glowRadius: 90,
        glowMaxAlpha: 0.55,

        // 设备像素比上限(性能保护)
        maxDpr: 2,

        // 性能保护:粒子数上限,超出则自动放大采样步长
        maxParticles: 6000
      };

      /* ================== 基础 ================== */

      var canvas = document.getElementById('stage');
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr);

      var W = 0;    // CSS 像素宽高
      var H = 0;
      var particles = [];
      var pointer = { x: -9999, y: -9999, px: -9999, py: -9999, active: false };
      var time = 0;

      // 预渲染星粒精灵:径向光晕小圆,画大图缩放可保持锐利且省性能
      var sprite = makeSprite();

      function makeSprite() {
        var s = 32;
        var c = document.createElement('canvas');
        c.width = c.height = s;
        var g = c.getContext('2d');
        var grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
        grad.addColorStop(0, 'rgba(255,255,255,0.95)');   // 中心亮白
        grad.addColorStop(0.25, 'rgba(160,215,255,0.75)');
        grad.addColorStop(0.6, 'rgba(77,166,255,0.22)');
        grad.addColorStop(1, 'rgba(77,166,255,0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, s, s);
        return c;
      }

      /* ================== 文字采样 ==================
         离屏画布绘制文字 → getImageData 取像素 → 生成粒子目标点 */
      function sampleText(text) {
        var off = document.createElement('canvas');
        off.width = W;
        off.height = H;
        var octx = off.getContext('2d');

        // 字号:按画布宽度自适应
        var fontSize = Math.min(W * 0.16, H * 0.34, 240);
        // 粗体无衬线,更易识别
        octx.font = '900 ' + fontSize + 'px Arial, "Helvetica Neue", sans-serif';
        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        octx.fillStyle = '#fff';
        octx.fillText(text, W / 2, H / 2);

        // 采样步长:小屏/大文本自动加粗步长,控制粒子总量
        var step = CONFIG.sampleStep;
        var data = octx.getImageData(0, 0, W, H).data;
        var pts = [];

        for (var y = 0; y < H; y += step) {
          for (var x = 0; x < W; x += step) {
            var idx = (y * W + x) * 4;
            if (data[idx + 3] > 128) pts.push([x, y]);
          }
        }

        // 超出上限则翻倍步长重采样
        if (pts.length > CONFIG.maxParticles) {
          pts = [];
          step *= 2;
          for (var y2 = 0; y2 < H; y2 += step) {
            for (var x2 = 0; x2 < W; x2 += step) {
              var i2 = (y2 * W + x2) * 4;
              if (data[i2 + 3] > 128) pts.push([x2, y2]);
            }
          }
        }
        return pts;
      }

      /* ================== 粒子 ================== */

      function Particle(tx, ty) {
        this.tx = tx;            // 目标(文字)位置
        this.ty = ty;
        this.x = tx;             // 当前位置
        this.y = ty;
        this.vx = 0;             // 速度(冲量用)
        this.vy = 0;
        this.phase = Math.random() * Math.PI * 2;   // 漂浮/闪烁相位
        this.color = CONFIG.colors[(Math.random() * CONFIG.colors.length) | 0];
        this.size = CONFIG.particleSize * (0.7 + Math.random() * 0.7);
        this.baseAlpha = 0.55 + Math.random() * 0.45;
      }

      Particle.prototype.update = function () {
        // 回位弹簧 + 阻尼(鼠标离开后缓慢归位)
        this.vx += (this.tx - this.x) * CONFIG.spring;
        this.vy += (this.ty - this.y) * CONFIG.spring;
        this.vx *= CONFIG.damping;
        this.vy *= CONFIG.damping;
        this.x += this.vx;
        this.y += this.vy;
      };

      Particle.prototype.draw = function () {
        // 轻微漂浮(呼吸感)
        var fx = Math.sin(time * CONFIG.floatSpeed + this.phase) * CONFIG.floatAmp;
        var fy = Math.cos(time * CONFIG.floatSpeed * 0.8 + this.phase) * CONFIG.floatAmp;
        // 轻微闪烁
        var tw = Math.sin(time * CONFIG.twinkleSpeed + this.phase * 1.7);
        var alpha = this.baseAlpha + tw * CONFIG.twinkleAmp;
        if (alpha < 0.08) alpha = 0.08;

        var s = this.size * 6;  // sprite 放大倍数(光晕直径)
        ctx.globalAlpha = alpha;
        ctx.drawImage(sprite, this.x + fx - s / 2, this.y + fy - s / 2, s, s);
      };

      /* ================== 交互 ================== */

      // 鼠标/触摸移动:推扰粒子,速度越快推力越强
      function applyPointer() {
        if (!pointer.active) return;

        var dx = pointer.x - pointer.px;
        var dy = pointer.y - pointer.py;
        var speed = Math.min(Math.hypot(dx, dy), 60);   // 移动速度(封顶)
        var R2 = CONFIG.mouseRadius * CONFIG.mouseRadius;

        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          var px = p.x - pointer.x;
          var py = p.y - pointer.y;
          var d2 = px * px + py * py;
          if (d2 < R2 && d2 > 0.01) {
            var d = Math.sqrt(d2);
            var f = (1 - d / CONFIG.mouseRadius) * CONFIG.pushForce * (1 + speed * CONFIG.speedFactor);
            p.vx += (px / d) * f;
            p.vy += (py / d) * f;
          }
        }
      }

      // 点击爆炸:从文字中心向外随机冲量,弹簧会自动回收成字符
      function explode() {
        var cx = W / 2;
        var cy = H / 2;
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          var ang = Math.random() * Math.PI * 2;
          var mag = CONFIG.blastForce * (0.4 + Math.random());
          p.vx += Math.cos(ang) * mag;
          p.vy += Math.sin(ang) * mag;
          // 再叠一层"离中心"方向,扩散更均匀
          var dx = p.x - cx;
          var dy = p.y - cy;
          var dl = Math.hypot(dx, dy) || 1;
          p.vx += (dx / dl) * CONFIG.blastForce * 0.6;
          p.vy += (dy / dl) * CONFIG.blastForce * 0.6;
        }
      }

      /* ================== 渲染循环 ================== */

      function frame() {
        time++;

        // 半透明清屏 → 运动中的粒子留下蓝色拖尾
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(4, 7, 15, ' + CONFIG.trail + ')';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        applyPointer();

        // 粒子光晕(鼠标附近的粒子更亮):先画一层暖光再画粒子?简化为鼠标处光晕
        if (pointer.active) {
          var dxs = pointer.x - pointer.px;
          var dys = pointer.y - pointer.py;
          var spd = Math.min(Math.hypot(dxs, dys), 60) / 60;
          var gr = CONFIG.glowRadius * (0.5 + spd);
          var glow = ctx.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, gr);
          glow.addColorStop(0, 'rgba(0, 191, 255, ' + CONFIG.glowMaxAlpha * (0.4 + spd * 0.6) + ')');
          glow.addColorStop(1, 'rgba(0, 191, 255, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(pointer.x, pointer.y, gr, 0, Math.PI * 2);
          ctx.fill();
        }

        // 更新 + 绘制粒子
        for (var i = 0; i < particles.length; i++) {
          particles[i].update();
        }
        for (var j = 0; j < particles.length; j++) {
          particles[j].draw();
        }

        ctx.globalAlpha = 1;

        // 速度记录(用于下一帧计算)
        pointer.px = pointer.x;
        pointer.py = pointer.y;

        requestAnimationFrame(frame);
      }

      /* ================== 尺寸与事件 ================== */

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr);
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // 重新采样文字,重建粒子(目标位置随之适配)
        var pts = sampleText(CONFIG.text);
        particles = pts.map(function (pt) { return new Particle(pt[0], pt[1]); });

        // 重建后立刻清一次屏,避免旧残影
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#04070f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 统一指针事件(鼠标 + 触摸 + 触控笔)
      canvas.addEventListener('pointermove', function (e) {
        pointer.x = e.clientX;
        pointer.y = e.clientY;
        pointer.active = true;
      });
      canvas.addEventListener('pointerleave', function () {
        pointer.active = false;
        pointer.x = pointer.px = -9999;
        pointer.y = pointer.py = -9999;
      });
      canvas.addEventListener('pointerdown', explode);

      // 移动端:离开画布也算取消
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          pointer.active = false;
          pointer.x = pointer.px = -9999;
          pointer.y = pointer.py = -9999;
        }
      });

      window.addEventListener('resize', resize);

      /* ================== 启动 ================== */
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
