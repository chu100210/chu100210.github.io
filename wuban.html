<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>五班 · 我们的初中回忆</title>
  <meta name="description" content="五班 — 我们的初中回忆">

  <!-- 安全头:与站点其他页面一致,media-src 允许本站视频,unsafe-inline 供本文件内联样式与脚本 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), midi=(), speaker=(), vibrate=(), fullscreen=(self)">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="color-scheme" content="dark">

  <style>
    /* ============================================================
       五班 · 首屏样式
       ============================================================ */

    /* ---------- 全局 ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: #0c0e12;               /* 首屏外的页面底色(可改) */
      color: #faf6ef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
    }

    /* ---------- 首屏 ---------- */
    .hero {
      position: relative;
      height: 100vh;
      height: 100svh;                    /* 移动端地址栏收起时也保持满屏 */
      overflow: hidden;
    }

    /* 视频层:铺满首屏,裁切居中 */
    .hero-media {
      position: absolute;
      inset: 0;
      transition: opacity 0.8s ease;     /* 滚动离开时淡出 */
    }

    /* 背景照片层:两张交叉淡入淡出 */
    .bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.05);
      transition: opacity 1.4s ease, transform 1.4s ease;
      will-change: opacity, transform;
    }

    .bg-layer.active {
      opacity: 1;
      transform: scale(1);
    }

    /* 暗色渐变遮罩:整体压暗去饱和,底部更深,保证文字可读 */
    .hero-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(10, 12, 16, 0.42) 0%,      /* 顶部:轻压暗 */
        rgba(10, 12, 16, 0.30) 40%,
        rgba(10, 12, 16, 0.55) 78%,     /* 底部更深,托住文字 */
        rgba(10, 12, 16, 0.78) 100%
      );
      /* 轻微去饱和(降低彩度,氛围更克制) */
      backdrop-filter: saturate(0.82);
      -webkit-backdrop-filter: saturate(0.82);
    }

    /* 文字层:桌面偏左下,移动端居中 */
    .hero-content {
      position: absolute;
      left: 7vw;
      bottom: 22vh;
      z-index: 2;
      transition: opacity 0.25s linear; /* 滚动时由 JS 控制淡出 */
      will-change: opacity;
    }

    /* "前缀词 + 五班" 主标题 */
    .hero-line {
      display: flex;
      align-items: baseline;             /* 两个字基线对齐 */
      gap: 0.55em;
      font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #faf6ef;                    /* 极浅暖白(可改) */
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);  /* 轻微阴影保证可读 */
      white-space: nowrap;
    }

    /* 前缀词:轮换的主角 */
    .hero-prefix {
      display: inline-block;
      font-size: clamp(34px, 6.4vw, 76px);
      /* 过渡时长在此调整(与 JS 里 SWAP_MS 保持一致) */
      transition: opacity 0.7s ease, transform 0.7s ease, filter 0.7s ease;
      will-change: opacity, transform, filter;
    }

    /* 旧词:淡出 + 轻微上移 + 变模糊 */
    .hero-prefix.swapping {
      opacity: 0;
      transform: translateY(-14px);
      filter: blur(8px);
    }

    /* 新词:淡入 + 轻微下移 + 从模糊到清晰(进场初始态,随后移除触发过渡) */
    .hero-prefix.entering {
      opacity: 0;
      transform: translateY(14px);
      filter: blur(8px);
      transition: none;                  /* 初始态不过渡,移除类后自然过渡回正常 */
    }

    /* "五班":固定不动 */
    .hero-name {
      font-size: clamp(56px, 10.5vw, 128px);
    }

    /* 副标题 */
    .hero-sub {
      margin-top: 1.2em;
      font-size: clamp(14px, 1.8vw, 18px);
      letter-spacing: 0.5em;
      text-indent: 0.5em;                /* 抵消末字间距,保持视觉居中 */
      color: rgba(250, 246, 239, 0.82);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
    }

    /* 向下滚动提示:轻微呼吸,不夸张(点击滑到第二屏) */
    .hero-scroll {
      position: absolute;
      left: 50%;
      bottom: 4.5vh;
      transform: translateX(-50%);
      z-index: 2;
      font-size: 13px;
      letter-spacing: 0.35em;
      color: rgba(250, 246, 239, 0.75);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
      animation: hero-breathe 2.6s ease-in-out infinite;
      transition: opacity 0.25s linear;
      cursor: pointer;
    }

    @keyframes hero-breathe {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 0.85; }
    }

    /* ---------- 第二屏:passion! 粒子文字 ----------
       不占满屏:仅首页下方一小块,页面可继续向下放内容 */
    .passion {
      position: relative;
      height: 58vh;
      min-height: 340px;
      background: #04070f;
      overflow: hidden;
      /* 本区域内滑动全部用于粒子扰动(滚动靠本区域之外) */
      touch-action: none;
    }

    .passion canvas {
      position: absolute;
      inset: 0;
      display: block;
    }

    .passion-label {
      position: absolute;
      top: 6vh;
      left: 6vw;
      z-index: 2;
      font-size: clamp(16px, 2.6vw, 22px);
      letter-spacing: 0.35em;
      color: rgba(226, 240, 255, 0.75);
      text-shadow: 0 0 18px rgba(77, 166, 255, 0.35);
      pointer-events: none;
    }

    .passion-hint {
      position: absolute;
      bottom: 4.5vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      font-size: 12px;
      letter-spacing: 0.25em;
      white-space: nowrap;
      color: rgba(180, 205, 235, 0.4);
      pointer-events: none;
    }

    /* ---------- 首屏之后的内容区 ----------
       当前为占位区,仅用于演示"滚动后视频淡出/暂停"。
       构建后续内容时,删除 .placeholder 并在此加入真实区块。 */
    .site-body {
      position: relative;
      min-height: 120vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 14vh 24px 0;
    }

    .placeholder {
      font-size: 15px;
      letter-spacing: 0.3em;
      color: rgba(250, 246, 239, 0.4);
    }

    /* ---------- 响应式:移动端文字居中 ---------- */
    @media (max-width: 768px) {
      .hero-content {
        left: 0;
        right: 0;
        bottom: 20vh;
        text-align: center;
      }
      .hero-line { justify-content: center; }

      /* 手机端移除口号粒子块与向下滚动提示(桌面端保留) */
      .passion { display: none; }
      .hero-scroll { display: none; }
    }

    /* ---------- 尊重减弱动效 ---------- */
    @media (prefers-reduced-motion: reduce) {
      .hero-scroll { animation: none; }
      .hero-prefix { transition: none; }
      .bg-layer { transition: none; }
    }
  </style>
</head>
<body>

  <!-- ======================= 首屏 ======================= -->
  <section class="hero" id="hero">
    <!-- 背景照片:由 JS 随机切换 wbbg 文件夹里的照片 -->
    <div class="hero-media" id="heroMedia">
      <div class="bg-layer active" id="bgA"></div>
      <div class="bg-layer" id="bgB"></div>
    </div>

    <!-- 暗色渐变遮罩 -->
    <div class="hero-overlay" aria-hidden="true"></div>

    <!-- 主文字 -->
    <div class="hero-content" id="heroContent">
      <h1 class="hero-line">
        <span class="hero-prefix" id="heroPrefix">奋进</span>
        <span class="hero-name">五班</span>
      </h1>
      <p class="hero-sub">我们的初中回忆</p>
    </div>

    <!-- 向下滚动提示 -->
    <div class="hero-scroll" id="heroScroll">↓ 向下滚动</div>
  </section>

  <!-- ======================= 第二屏:口号 ======================= -->
  <section class="passion" id="passionSection">
    <canvas id="passionCanvas"></canvas>
    <p class="passion-label">我们的口号是</p>
    <p class="passion-hint">滑动扰动 · 水流般归位</p>
  </section>

  <script>
    /* ============================================================
       五班 · 首屏脚本
       可调参数集中在下方「配置区」,便于修改
       ============================================================ */
    (function () {
      'use strict';

      /* ---------- 配置区 ---------- */

      // 轮换的前缀词:增删改这里即可(建议保持 6～8 个)
      var WORDS = ['奋进', '团结', '笃行', '蓬勃', '坚毅', '向上', '齐心', '热忱'];

      // 轮换间隔(毫秒):每 2.5～3.5 秒切换一次
      var INTERVAL_MS = 3000;

      // 过渡时长(毫秒):600～800ms,需与 CSS 中 .hero-prefix 的 transition 时长一致
      var SWAP_MS = 700;

      // 背景照片目录与文件名列表(★ 增删照片:改 wbbg 文件夹后同步改这里)
      var PHOTO_DIR = 'wbbg/';
      var PHOTOS = [
        '1e158f068b4105c97e44fd0122cd13e7.jpg',
        '4339c8a6239d3033eba35eebd834b187.jpg',
        '594861f44a8b6753891aaef1eda49b6d.jpg',
        '5f4c96d9c3d8e09ea2611929bde205d3.jpg',
        '8035b6cf16b5905f59c72022efeb32e6.jpg',
        '85222a5e5335d645428a4d8f8765b372.jpg',
        'bb0306dfd5515db44f45cda1fbd0e9c9.jpg',
        'e9144304656af46ed8b7ff7eeb43d8dd.jpg',
        'fb11b3eeac6772bf1a92fc6c2e2526ed.jpg'
      ];

      // 背景交叉淡入时长(毫秒):比文字过渡稍慢,更沉稳
      var BG_FADE_MS = 1400;

      /* ---------- 元素 ---------- */
      var hero = document.getElementById('hero');
      var heroMedia = document.getElementById('heroMedia');
      var heroContent = document.getElementById('heroContent');
      var heroScroll = document.getElementById('heroScroll');
      var prefixEl = document.getElementById('heroPrefix');
      var bgLayers = [
        document.getElementById('bgA'),
        document.getElementById('bgB')
      ];

      var wordIndex = 0;
      var swapTimer = null;

      /* ---------- 前缀词轮换 ----------
         旧词:淡出 + 上移 + 变模糊(.swapping)
         新词:从下方 + 模糊处淡入(.entering 初始态,移除后过渡到清晰) */
      function swapWord() {
        if (swapTimer) return;

        prefixEl.classList.remove('entering');
        prefixEl.classList.add('swapping');            // 旧词淡出

        swapTimer = setTimeout(function () {
          wordIndex = (wordIndex + 1) % WORDS.length;  // 循环取下一个词
          prefixEl.textContent = WORDS[wordIndex];

          prefixEl.classList.remove('swapping');
          prefixEl.classList.add('entering');          // 新词初始态(透明+模糊+偏下)

          // 下一帧再移除 entering,让浏览器产生过渡
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              prefixEl.classList.remove('entering');
              swapTimer = null;
            });
          });
        }, SWAP_MS);
      }

      function startRotation() {
        setInterval(function () { tick(); }, INTERVAL_MS);
      }

      /* ---------- 背景照片随机播放 ----------
         与文字轮换共用同一个计时器,切换节奏同步 */
      var bgOrder = [];     // 洗牌后的播放顺序(存 PHOTOS 下标)
      var bgPos = 0;        // 当前播到第几张
      var bgCurLayer = 0;   // 当前显示的层(0 或 1)

      // Fisher-Yates 洗牌
      function shuffled(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }

      // 取下一张照片(一轮播完自动重新洗牌,同一轮内不重复)
      function nextPhoto() {
        if (bgPos >= bgOrder.length) {
          bgOrder = shuffled(PHOTOS.map(function (_, i) { return i; }));
          bgPos = 0;
        }
        return PHOTOS[bgOrder[bgPos++]];
      }

      // 切换背景:新图层淡入,旧图层淡出
      function swapBackground() {
        var nextLayerIdx = 1 - bgCurLayer;
        bgLayers[nextLayerIdx].style.backgroundImage =
          "url('" + PHOTO_DIR + nextPhoto() + "')";
        bgLayers[nextLayerIdx].classList.add('active');
        bgLayers[bgCurLayer].classList.remove('active');
        bgCurLayer = nextLayerIdx;
      }

      // 启动时全部预加载(小图,一次加载后切换零延迟)
      function preloadAllPhotos() {
        PHOTOS.forEach(function (f) {
          var img = new Image();
          img.src = PHOTO_DIR + f;
        });
      }

      // 首屏第一张
      bgLayers[0].style.backgroundImage =
        "url('" + PHOTO_DIR + nextPhoto() + "')";
      preloadAllPhotos();

      /* ---------- 统一节拍:文字与背景同频切换 ---------- */
      function tick() {
        swapWord();       // 文字:旧词淡出 → 新词淡入
        swapBackground(); // 背景:同步交叉淡入
      }

      /* ---------- 滚动处理 ----------
         1. 滚过首屏一半后暂停视频(省电省流量),回滚时恢复
         2. 滚动过程中文字与提示逐渐淡出,不干扰后续内容 */
      var ticking = false;

      function onScroll() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
          var y = window.scrollY || window.pageYOffset;
          var heroHeight = hero.offsetHeight;

          // 背景层淡出 / 恢复
          if (y > heroHeight * 0.5) {
            heroMedia.style.opacity = '0';              // 背景照片层淡出
          } else {
            heroMedia.style.opacity = '1';
          }

          // 文字与提示随滚动淡出(0～60% 首屏高度之间完成)
          var fade = Math.min(1, y / (heroHeight * 0.6));
          heroContent.style.opacity = String(1 - fade);
          heroScroll.style.opacity = String(1 - fade);

          ticking = false;
        });
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll(); // 初始执行一次,确保状态正确

      /* ---------- 启动轮换 ---------- */
      startRotation();

      /* ---------- 滚动提示:点击滑到第二屏 ---------- */
      heroScroll.addEventListener('click', function () {
        var target = document.getElementById('passionSection');
        if (target && target.scrollIntoView) {
          target.scrollIntoView({ behavior: 'smooth' });
        }
      });
    })();

    /* ============================================================
       第二屏 passion! 粒子文字引擎(流水交互版)
       ============================================================ */
    (function () {
      'use strict';

      var CONFIG = {
        text: 'passion!',            // 显示文字
        colors: ['#4da6ff', '#00bfff', '#7dd3fc'],   // 蓝色系

        // 采样步长(px):越大粒子越稀疏(当前较疏、清爽)
        sampleStep: 6,

        // 星粒大小
        particleSize: 1.15,

        // 漂浮 / 闪烁
        floatAmp: 1.2,
        floatSpeed: 0.001,
        twinkleAmp: 0.2,
        twinkleSpeed: 0.0012,

        // 水流式回位:位置平滑趋近目标(无弹簧振荡,不回弹)
        flow: 0.055,

        // 冲量消散:越小扰动越柔,越大越冲
        drag: 0.82,

        // 鼠标影响半径与推力(柔和,速度快推力略增)
        mouseRadius: 100,
        pushForce: 0.16,
        speedFactor: 0.035,

        // 清屏强度:越大残影越少、文字越清晰
        trail: 0.34,

        // 鼠标光晕
        glowRadius: 70,
        glowMaxAlpha: 0.4,

        maxDpr: 2,
        maxParticles: 5000
      };

      // 移动端性能与效果:粒子稍密更显形,降低像素比保证流畅
      if (window.innerWidth < 768) {
        CONFIG.sampleStep = 6;
        CONFIG.maxParticles = 3000;
        CONFIG.maxDpr = 1.5;
        CONFIG.trail = 0.42;
        CONFIG.particleSize = 1.5;
        CONFIG.mouseRadius = 90;
        CONFIG.pushForce = 0.2;
      }

      var section = document.getElementById('passionSection');
      var canvas = document.getElementById('passionCanvas');
      var ctx = canvas.getContext('2d');
      var dpr = 1;
      var W = 0;
      var H = 0;
      var particles = [];
      var pointer = { x: -9999, y: -9999, px: -9999, py: -9999, active: false };
      var time = 0;

      // 星粒精灵:亮核 + 快速衰减的光晕(锐利不糊)
      function makeSprite() {
        var s = 32;
        var c = document.createElement('canvas');
        c.width = c.height = s;
        var g = c.getContext('2d');
        var grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.16, 'rgba(200,230,255,0.9)');
        grad.addColorStop(0.45, 'rgba(77,166,255,0.35)');
        grad.addColorStop(1, 'rgba(77,166,255,0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, s, s);
        return c;
      }

      var sprite = makeSprite();

      // 离屏采样文字 → 粒子目标点
      function sampleText() {
        var off = document.createElement('canvas');
        off.width = W;
        off.height = H;
        var octx = off.getContext('2d');
        var fontSize = Math.min(W * 0.2, H * 0.42, 210);
        // 字体:微软雅黑(iOS/安卓回退 PingFang/Noto/默认无衬线)
        octx.font = '900 ' + fontSize + 'px "Microsoft YaHei", "微软雅黑", "PingFang SC", "Noto Sans SC", sans-serif';
        octx.textAlign = 'left';      // 手动居中,避免部分移动浏览器 textAlign 异常
        octx.textBaseline = 'middle';
        octx.fillStyle = '#fff';
        var tw = octx.measureText(CONFIG.text).width;
        octx.fillText(CONFIG.text, Math.max(0, (W - tw) / 2), H / 2);

        var step = CONFIG.sampleStep;
        var data = octx.getImageData(0, 0, W, H).data;
        var pts = [];
        for (var y = 0; y < H; y += step) {
          for (var x = 0; x < W; x += step) {
            if (data[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
          }
        }
        if (pts.length > CONFIG.maxParticles) {
          pts = [];
          step *= 2;
          for (var y2 = 0; y2 < H; y2 += step) {
            for (var x2 = 0; x2 < W; x2 += step) {
              if (data[(y2 * W + x2) * 4 + 3] > 128) pts.push([x2, y2]);
            }
          }
        }
        return pts;
      }

      function Particle(tx, ty) {
        this.tx = tx; this.ty = ty;
        this.x = tx; this.y = ty;
        this.vx = 0; this.vy = 0;
        this.phase = Math.random() * Math.PI * 2;
        this.color = CONFIG.colors[(Math.random() * CONFIG.colors.length) | 0];
        this.size = CONFIG.particleSize * (0.75 + Math.random() * 0.6);
        this.baseAlpha = 0.6 + Math.random() * 0.4;
      }

      // 水流式回位:位置平滑趋近目标 + 冲量位移,无回弹振荡
      Particle.prototype.update = function () {
        this.x += (this.tx - this.x) * CONFIG.flow;
        this.y += (this.ty - this.y) * CONFIG.flow;
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= CONFIG.drag;
        this.vy *= CONFIG.drag;
      };

      Particle.prototype.draw = function () {
        var fx = Math.sin(time * CONFIG.floatSpeed + this.phase) * CONFIG.floatAmp;
        var fy = Math.cos(time * CONFIG.floatSpeed * 0.8 + this.phase) * CONFIG.floatAmp;
        var tw = Math.sin(time * CONFIG.twinkleSpeed + this.phase * 1.7);
        var alpha = this.baseAlpha + tw * CONFIG.twinkleAmp;
        if (alpha < 0.1) alpha = 0.1;
        var s = this.size * 7;
        ctx.globalAlpha = alpha;
        ctx.drawImage(sprite, this.x + fx - s / 2, this.y + fy - s / 2, s, s);
      };

      // 柔和推扰:速度快推力略增
      function applyPointer() {
        if (!pointer.active) return;
        var speed = Math.min(Math.hypot(pointer.x - pointer.px, pointer.y - pointer.py), 60);
        var R2 = CONFIG.mouseRadius * CONFIG.mouseRadius;
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          var px = p.x - pointer.x;
          var py = p.y - pointer.y;
          var d2 = px * px + py * py;
          if (d2 < R2 && d2 > 0.01) {
            var d = Math.sqrt(d2);
            var f = (1 - d / CONFIG.mouseRadius) * CONFIG.pushForce * (1 + speed * CONFIG.speedFactor);
            p.vx += (px / d) * f;
            p.vy += (py / d) * f;
          }
        }
      }

      var running = false;
      var rafId = null;

      function frame() {
        time++;
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(4, 7, 15, ' + CONFIG.trail + ')';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        applyPointer();

        if (pointer.active) {
          var spd = Math.min(Math.hypot(pointer.x - pointer.px, pointer.y - pointer.py), 60) / 60;
          var gr = CONFIG.glowRadius * (0.5 + spd);
          var glow = ctx.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, gr);
          glow.addColorStop(0, 'rgba(0, 191, 255, ' + CONFIG.glowMaxAlpha * (0.4 + spd * 0.6) + ')');
          glow.addColorStop(1, 'rgba(0, 191, 255, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(pointer.x, pointer.y, gr, 0, Math.PI * 2);
          ctx.fill();
        }

        for (var i = 0; i < particles.length; i++) particles[i].update();
        for (var j = 0; j < particles.length; j++) particles[j].draw();
        ctx.globalAlpha = 1;

        pointer.px = pointer.x;
        pointer.py = pointer.y;

        if (running) rafId = requestAnimationFrame(frame);
      }

      function start() {
        if (!running) {
          running = true;
          rafId = requestAnimationFrame(frame);
        }
      }

      function stop() {
        running = false;
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      }

      // 滚入第二屏才运行,滚出暂停(省资源)
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) start();
          else stop();
        });
      }, { threshold: 0.04 });
      io.observe(section);

      // 统一指针事件(桌面鼠标 + 触控笔)
      function setPointer(e) {
        var rect = canvas.getBoundingClientRect();
        pointer.x = e.clientX - rect.left;
        pointer.y = e.clientY - rect.top;
        pointer.active = true;
      }
      canvas.addEventListener('pointermove', setPointer);
      canvas.addEventListener('pointerleave', function () {
        pointer.active = false;
        pointer.x = pointer.px = -9999;
        pointer.y = pointer.py = -9999;
      });

      /* ---------- 触摸扰动(手机) ----------
         touch-action: none + 非被动 touchmove,滑动手势全部用于扰动;
         页面滚动请用本区域之外的部分 */
      function sectionInUse() {
        var r = section.getBoundingClientRect();
        var vh = window.innerHeight;
        return r.top < vh * 0.5 && r.bottom > vh * 0.3;
      }

      function touchPos(t) {
        var rect = canvas.getBoundingClientRect();
        pointer.x = t.clientX - rect.left;
        pointer.y = t.clientY - rect.top;
      }

      section.addEventListener('touchstart', function (e) {
        if (!sectionInUse()) return;
        var t = e.touches[0];
        touchPos(t);
        pointer.px = pointer.x;
        pointer.py = pointer.y;
        pointer.active = true;
      }, { passive: true });

      section.addEventListener('touchmove', function (e) {
        if (!sectionInUse()) return;
        e.preventDefault();   // 阻断滚动,全部交给扰动
        touchPos(e.touches[0]);
      }, { passive: false });

      section.addEventListener('touchend', function () {
        pointer.active = false;
        pointer.x = pointer.px = -9999;
        pointer.y = pointer.py = -9999;
      }, { passive: true });

      function resize() {
        W = section.clientWidth;
        H = section.clientHeight;
        dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr);
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        particles = sampleText().map(function (pt) { return new Particle(pt[0], pt[1]); });
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#04070f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      // 尺寸变化防抖:移动端地址栏收起/展开会频繁触发 resize,避免反复重建粒子
      var resizeTimer = null;
      window.addEventListener('resize', function () {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 220);
      });

      resize();
    })();
  </script>
</body>
</html>
