<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="description" content="五班 — 我们的初中回忆">

  <!-- 安全头:与站点其他页面一致,media-src 允许本站视频,unsafe-inline 供本文件内联样式与脚本 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), midi=(), speaker=(), vibrate=(), fullscreen=(self)">

  <meta name="color-scheme" content="dark">

  <style>
    /* ============================================================
       五班 · 首屏样式
       ============================================================ */

    /* ---------- 全局 ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: #0c0e12;               /* 首屏外的页面底色(可改) */
      color: #faf6ef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
    }

    /* ---------- 首屏 ---------- */
    .hero {
      position: relative;
      height: 100vh;
      height: 100svh;                    /* 移动端地址栏收起时也保持满屏 */
      overflow: hidden;
    }

    /* 视频层:铺满首屏,裁切居中 */
    .hero-media {
      position: absolute;
      inset: 0;
      transition: opacity 0.8s ease;     /* 滚动离开时淡出 */
    }

    /* 背景照片层:两张交叉淡入淡出 */
    .bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.05);
      transition: opacity 1.4s ease, transform 1.4s ease;
      will-change: opacity, transform;
    }

    .bg-layer.active {
      opacity: 1;
      transform: scale(1);
    }

    /* 暗色渐变遮罩:整体压暗去饱和,底部更深,保证文字可读 */
    .hero-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(10, 12, 16, 0.42) 0%,      /* 顶部:轻压暗 */
        rgba(10, 12, 16, 0.30) 40%,
        rgba(10, 12, 16, 0.55) 78%,     /* 底部更深,托住文字 */
        rgba(10, 12, 16, 0.78) 100%
      );
      /* 轻微去饱和(降低彩度,氛围更克制) */
      backdrop-filter: saturate(0.82);
      -webkit-backdrop-filter: saturate(0.82);
    }

    /* 文字层:桌面偏左下,移动端居中 */
    .hero-content {
      position: absolute;
      left: 7vw;
      bottom: 22vh;
      z-index: 2;
      transition: opacity 0.25s linear; /* 滚动时由 JS 控制淡出 */
      will-change: opacity;
    }

    /* "前缀词 + 五班" 主标题 */
    .hero-line {
      display: flex;
      align-items: baseline;             /* 两个字基线对齐 */
      gap: 0.55em;
      font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #faf6ef;                    /* 极浅暖白(可改) */
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);  /* 轻微阴影保证可读 */
      white-space: nowrap;
    }

    /* 前缀词:轮换的主角 */
    .hero-prefix {
      display: inline-block;
      font-size: clamp(34px, 6.4vw, 76px);
      /* 过渡时长在此调整(与 JS 里 SWAP_MS 保持一致) */
      transition: opacity 0.7s ease, transform 0.7s ease, filter 0.7s ease;
      will-change: opacity, transform, filter;
    }

    /* 旧词:淡出 + 轻微上移 + 变模糊 */
    .hero-prefix.swapping {
      opacity: 0;
      transform: translateY(-14px);
      filter: blur(8px);
    }

    /* 新词:淡入 + 轻微下移 + 从模糊到清晰(进场初始态,随后移除触发过渡) */
    .hero-prefix.entering {
      opacity: 0;
      transform: translateY(14px);
      filter: blur(8px);
      transition: none;                  /* 初始态不过渡,移除类后自然过渡回正常 */
    }

    /* "五班":固定不动 */
    .hero-name {
      font-size: clamp(56px, 10.5vw, 128px);
    }

    /* 副标题 */
    .hero-sub {
      margin-top: 1.2em;
      font-size: clamp(14px, 1.8vw, 18px);
      letter-spacing: 0.5em;
      text-indent: 0.5em;                /* 抵消末字间距,保持视觉居中 */
      color: rgba(250, 246, 239, 0.82);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
    }

    /* 向下滚动提示:轻轻呼吸,点击滑到「我们的照片」 */
    .hero-scroll {
      position: absolute;
      left: 50%;
      bottom: 4.5vh;
      transform: translateX(-50%);
      z-index: 2;
      font-size: 13px;
      letter-spacing: 0.35em;
      color: rgba(250, 246, 239, 0.75);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
      animation: hero-breathe 2.6s ease-in-out infinite;
      transition: opacity 0.25s linear;
      cursor: pointer;
      white-space: nowrap;
    }

    @keyframes hero-breathe {
      0%, 100% { opacity: 0.42; }
      50%      { opacity: 0.85; }
    }

    /* ---------- 第二屏:我们的照片 ---------- */
    .photos {
      position: relative;
      isolation: isolate;
      padding: 16vh 6vw 18vh;
      background:
        radial-gradient(900px 520px at 12% -8%, rgba(77, 166, 255, 0.16), transparent 62%),
        radial-gradient(760px 460px at 92% 6%, rgba(255, 196, 120, 0.10), transparent 62%),
        #0c0e12;
      overflow: hidden;
    }

    /* 极淡的颗粒纹理,让大色块更有质感 */
    .photos::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.55;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 3px 3px;
    }

    .photos-inner {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
    }

    /* 顶部渐隐,和首屏照片自然衔接 */
    .photos::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 18vh;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(12, 14, 18, 0.92) 0%, rgba(12, 14, 18, 0) 100%);
    }

    .photos-kicker {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(250, 246, 239, 0.45);
    }

    .photos-title {
      margin: 20px 0 0;
      font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
      font-weight: 600;
      font-size: clamp(38px, 6.4vw, 76px);
      line-height: 1.15;
      letter-spacing: 0.14em;
      color: #faf6ef;
      text-shadow: 0 2px 28px rgba(0, 0, 0, 0.45);
    }

    .photos-sub {
      margin: 18px 0 0;
      max-width: 44em;
      font-size: clamp(14px, 1.5vw, 17px);
      line-height: 2;
      letter-spacing: 0.06em;
      color: rgba(250, 246, 239, 0.62);
    }

    /* 主入口卡片:整块可点,通往九五时光册 */
    .photo-card {
      position: relative;
      display: block;
      margin-top: clamp(36px, 6vh, 64px);
      border-radius: 28px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.9);
      transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1),
                  box-shadow 0.7s ease,
                  border-color 0.7s ease;
    }

    .photo-card:hover,
    .photo-card:focus-visible {
      transform: translateY(-8px);
      border-color: rgba(255, 255, 255, 0.24);
      box-shadow: 0 44px 100px -34px rgba(0, 0, 0, 0.95);
      outline: none;
    }

    .photo-card-media {
      position: relative;
      aspect-ratio: 16 / 9;
      min-height: 260px;
      overflow: hidden;
      /* 兜底图:JS 未执行时也能看到照片 */
      background: #0a0c10 url('wbbg/4339c8a6239d3033eba35eebd834b187.jpg') center / cover no-repeat;
      perspective: 1600px;
      transform: scale(1.02);
      transition: transform 1.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* 翻页层:以左边缘为轴翻过去,背面朝外时自动隐藏 */
    .photo-card-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-size: cover;
      background-position: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform-origin: left center;
      transform: rotateY(0deg);
      transition: transform 1.05s cubic-bezier(0.55, 0.06, 0.2, 1);
      will-change: transform;
      filter: saturate(0.92) brightness(0.82);
    }

    .photo-card-layer.is-top { z-index: 2; }

    .photo-card-layer.is-flipping { transform: rotateY(-180deg); }

    /* 翻页时的侧光阴影,增强纸张立体感 */
    .photo-card-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0) 62%);
      opacity: 0;
      transition: opacity 0.55s ease;
    }

    .photo-card-layer.is-flipping::after { opacity: 1; }

    .photo-card:hover .photo-card-media { transform: scale(1.035); }

    .photo-card-shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(8, 10, 14, 0.10) 0%,
        rgba(8, 10, 14, 0.34) 42%,
        rgba(8, 10, 14, 0.88) 100%
      );
    }

    .photo-card-body {
      position: absolute;
      inset: auto 0 0 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: clamp(20px, 3vw, 40px);
    }

    .photo-card-eyebrow {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.38em;
      color: rgba(250, 246, 239, 0.58);
    }

    .photo-card-name {
      margin: 10px 0 0;
      font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
      font-size: clamp(24px, 3.4vw, 42px);
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #faf6ef;
    }

    .photo-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .photo-card-tag {
      padding: 5px 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: rgba(250, 246, 239, 0.78);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .photo-card-cta {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      flex: none;
      font-size: 13px;
      letter-spacing: 0.28em;
      color: #faf6ef;
      white-space: nowrap;
    }

    .photo-card-arrow {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.28);
      font-style: normal;
      font-size: 18px;
      transition: background 0.45s ease, color 0.45s ease,
                  border-color 0.45s ease, transform 0.45s ease;
    }

    .photo-card:hover .photo-card-arrow {
      background: #faf6ef;
      border-color: #faf6ef;
      color: #0c0e12;
      transform: translateX(6px);
    }

    /* 分类快捷入口 */
    .photo-quick {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 12px;
      margin-top: 22px;
    }

    .photo-quick a {
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      color: rgba(250, 246, 239, 0.72);
      font-size: 13px;
      letter-spacing: 0.16em;
      text-decoration: none;
      transition: background 0.3s ease, border-color 0.3s ease,
                  color 0.3s ease, transform 0.3s ease;
    }

    .photo-quick a:hover,
    .photo-quick a:focus-visible {
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.26);
      color: #fff;
      transform: translateY(-2px);
      outline: none;
    }

    /* 入场动画(结束后回到常态,不影响 hover) */
    @keyframes photo-rise {
      from { opacity: 0; transform: translateY(26px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .photos-kicker { animation: photo-rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
    .photos-title  { animation: photo-rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.08s backwards; }
    .photos-sub    { animation: photo-rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.16s backwards; }
    .photo-card    { animation: photo-rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.24s backwards; }
    .photo-quick   { animation: photo-rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.32s backwards; }

    /* ---------- 响应式:移动端文字居中 ---------- */
    @media (max-width: 768px) {
      .hero-content {
        left: 0;
        right: 0;
        bottom: 20vh;
        text-align: center;
      }
      .hero-line { justify-content: center; }

      .photos { padding: 12vh 24px 14vh; }

      .photo-card { border-radius: 22px; }
      .photo-card-media { aspect-ratio: 4 / 3; min-height: 0; }

      /* 移动端:文案与按钮上下排列,避免挤压 */
      .photo-card-body {
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
      }
      .photo-card-cta { letter-spacing: 0.22em; }
      .photo-card-arrow { width: 44px; height: 44px; font-size: 16px; }
    }

    /* ---------- 尊重减弱动效 ---------- */
    @media (prefers-reduced-motion: reduce) {
      .hero-scroll { animation: none; }
      .hero-prefix { transition: none; }
      .bg-layer { transition: none; }
      .photo-card-media { transition: none; }
      .photo-card-layer { transition: none; }
      .photos-kicker,
      .photos-title,
      .photos-sub,
      .photo-card,
      .photo-quick { animation: none; }
    }
  </style>
</head>
<body>

  <!-- ======================= 首屏 ======================= -->
  <section class="hero" id="hero">
    <!-- 背景照片:由 JS 随机切换 wbbg 文件夹里的照片 -->
    <div class="hero-media" id="heroMedia">

  <!-- ======================= 我们的照片 ======================= -->
  <section class="photos" id="photos">
    <div class="photos-inner">
      <p class="photos-kicker">CLASS 95 · PHOTO ARCHIVE</p>
      <h2 class="photos-title">我们的照片</h2>

  </section>

  <script>
    /* ============================================================
       五班 · 首屏脚本
       可调参数集中在下方「配置区」,便于修改
       ============================================================ */
    (function () {
      'use strict';

      /* ---------- 配置区 ---------- */

      // 轮换的前缀词:增删改这里即可(建议保持 6～8 个)
      var WORDS = ['奋进', '团结', '笃行', '蓬勃', '坚毅', '向上', '齐心', '热忱'];

      // 轮换间隔(毫秒):每 2.5～3.5 秒切换一次
      var INTERVAL_MS = 3000;

      // 过渡时长(毫秒):600～800ms,需与 CSS 中 .hero-prefix 的 transition 时长一致
      var SWAP_MS = 700;

      // 背景照片目录与文件名列表(★ 增删照片:改 wbbg 文件夹后同步改这里)
      var PHOTO_DIR = 'wbbg/';
      var PHOTOS = [
        '1e158f068b4105c97e44fd0122cd13e7.jpg',
        '4339c8a6239d3033eba35eebd834b187.jpg',
        '594861f44a8b6753891aaef1eda49b6d.jpg',
        '5f4c96d9c3d8e09ea2611929bde205d3.jpg',
        '8035b6cf16b5905f59c72022efeb32e6.jpg',
        '85222a5e5335d645428a4d8f8765b372.jpg',
        'bb0306dfd5515db44f45cda1fbd0e9c9.jpg',
        'e9144304656af46ed8b7ff7eeb43d8dd.jpg',
        'fb11b3eeac6772bf1a92fc6c2e2526ed.jpg'
      ];

      // 背景交叉淡入时长(毫秒):比文字过渡稍慢,更沉稳
      var BG_FADE_MS = 1400;

      /* ---------- 元素 ---------- */
      var hero = document.getElementById('hero');
      var heroMedia = document.getElementById('heroMedia');
      var heroContent = document.getElementById('heroContent');
      var heroScroll = document.getElementById('heroScroll');
      var prefixEl = document.getElementById('heroPrefix');
      var bgLayers = [
        document.getElementById('bgA'),
        document.getElementById('bgB')
      ];

      var wordIndex = 0;
      var swapTimer = null;

      /* ---------- 前缀词轮换 ----------
         旧词:淡出 + 上移 + 变模糊(.swapping)
         新词:从下方 + 模糊处淡入(.entering 初始态,移除后过渡到清晰) */
      function swapWord() {
        if (swapTimer) return;

        prefixEl.classList.remove('entering');
        prefixEl.classList.add('swapping');            // 旧词淡出

        swapTimer = setTimeout(function () {
          wordIndex = (wordIndex + 1) % WORDS.length;  // 循环取下一个词
          prefixEl.textContent = WORDS[wordIndex];

          prefixEl.classList.remove('swapping');
          prefixEl.classList.add('entering');          // 新词初始态(透明+模糊+偏下)

          // 下一帧再移除 entering,让浏览器产生过渡
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              prefixEl.classList.remove('entering');
              swapTimer = null;
            });
          });
        }, SWAP_MS);
      }

      function startRotation() {
        setInterval(function () { tick(); }, INTERVAL_MS);
      }

      /* ---------- 背景照片随机播放 ----------
         与文字轮换共用同一个计时器,切换节奏同步 */
      var bgOrder = [];     // 洗牌后的播放顺序(存 PHOTOS 下标)
      var bgPos = 0;        // 当前播到第几张
      var bgCurLayer = 0;   // 当前显示的层(0 或 1)

      // Fisher-Yates 洗牌
      function shuffled(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }

      // 取下一张照片(一轮播完自动重新洗牌,同一轮内不重复)
      function nextPhoto() {
        if (bgPos >= bgOrder.length) {
          bgOrder = shuffled(PHOTOS.map(function (_, i) { return i; }));
          bgPos = 0;
        }
        return PHOTOS[bgOrder[bgPos++]];
      }

      // 切换背景:新图层淡入,旧图层淡出
      function swapBackground() {
        var nextLayerIdx = 1 - bgCurLayer;
        bgLayers[nextLayerIdx].style.backgroundImage =
          "url('" + PHOTO_DIR + nextPhoto() + "')";
        bgLayers[nextLayerIdx].classList.add('active');
        bgLayers[bgCurLayer].classList.remove('active');
        bgCurLayer = nextLayerIdx;
      }

      // 启动时全部预加载(小图,一次加载后切换零延迟)
      function preloadAllPhotos() {
        PHOTOS.forEach(function (f) {
          var img = new Image();
          img.src = PHOTO_DIR + f;
        });
      }

      // 首屏第一张
      bgLayers[0].style.backgroundImage =
        "url('" + PHOTO_DIR + nextPhoto() + "')";
      preloadAllPhotos();

      /* ---------- 卡片封面翻页 ----------
         两层交替:顶层绕左边缘翻走,露出底层已备好的下一张,
         翻完后角色互换,像翻相册一样一张张过 */
      var cardLayers = [
        document.getElementById('cardLayerA'),
        document.getElementById('cardLayerB')
      ];
      var cardTopIdx = 1;          // 当前盖在上面的是哪一层
      var CARD_SWAP_MS = 4500;     // 每 4.5 秒翻一页
      var CARD_FLIP_MS = 1050;     // 与 CSS 中 layer 的 transition 时长一致

      function cardPhotoUrl() {
        return "url('" + PHOTO_DIR + nextPhoto() + "')";
      }

      function initCardPages() {
        // A 层放下一张(会被翻出来的),B 层放当前这张(盖在上面)
        cardLayers[0].style.backgroundImage = cardPhotoUrl();
        cardLayers[1].style.backgroundImage = cardPhotoUrl();
        cardLayers[0].classList.remove('is-top', 'is-flipping');
        cardLayers[1].classList.add('is-top');
        cardTopIdx = 1;
      }

      function flipCardPage() {
        var top = cardLayers[cardTopIdx];
        var under = cardLayers[1 - cardTopIdx];
        if (!top || !under) return;

        top.classList.add('is-flipping');

        setTimeout(function () {
          // 翻完:旧顶页退到下面并换上下一张,原底页升为顶层
          // 复位时临时关掉过渡,避免"翻回去"的残影
          top.style.transition = 'none';
          top.classList.remove('is-flipping', 'is-top');
          top.style.backgroundImage = cardPhotoUrl();
          void top.offsetWidth;
          top.style.transition = '';

          under.classList.add('is-top');
          cardTopIdx = 1 - cardTopIdx;
        }, CARD_FLIP_MS);
      }

      function startCardSlideshow() {
        if (!cardLayers[0] || !cardLayers[1]) return;
        initCardPages();

        // 尊重「减少动效」:只留一张静图
        var reduce = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) return;

        setInterval(function () {
          if (document.hidden) return;   // 切到后台时暂停,省电
          flipCardPage();
        }, CARD_SWAP_MS);
      }

      startCardSlideshow();

      /* ---------- 统一节拍:文字与背景同频切换 ---------- */
      function tick() {
        swapWord();       // 文字:旧词淡出 → 新词淡入
        swapBackground(); // 背景:同步交叉淡入
      }

      /* ---------- 滚动处理 ----------
         1. 滚过首屏一半后暂停视频(省电省流量),回滚时恢复
         2. 滚动过程中文字与提示逐渐淡出,不干扰后续内容 */
      var ticking = false;

      function onScroll() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
          var y = window.scrollY || window.pageYOffset;
          var heroHeight = hero.offsetHeight;

          // 背景层淡出 / 恢复
          if (y > heroHeight * 0.5) {
            heroMedia.style.opacity = '0';              // 背景照片层淡出
          } else {
            heroMedia.style.opacity = '1';
          }

          // 文字与提示随滚动淡出(0～60% 首屏高度之间完成)
          var fade = Math.min(1, y / (heroHeight * 0.6));
          heroContent.style.opacity = String(1 - fade);
          if (heroScroll) heroScroll.style.opacity = String(1 - fade);

          ticking = false;
        });
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll(); // 初始执行一次,确保状态正确

      /* ---------- 启动轮换 ---------- */
      startRotation();

      /* ---------- 滚动提示:点击滑到「我们的照片」 ---------- */
      function goPhotos() {
        var target = document.getElementById('photos');
        if (target && target.scrollIntoView) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      if (heroScroll) {
        heroScroll.addEventListener('click', goPhotos);
        heroScroll.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            goPhotos();
          }
        });
      }
    })();
  </script>
</body>
</html>
